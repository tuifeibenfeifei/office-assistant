<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Peak Hours">
  <defs>
    <linearGradient id="ph-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#101725"/>
    </linearGradient>
    <linearGradient id="ph-off" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52c41a"/>
      <stop offset="1" stop-color="#237804"/>
    </linearGradient>
    <linearGradient id="ph-peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#d4380d"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#ph-sky)"/>
  <!-- 表盘 -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#3d4a63" stroke-width="6"/>
  <!-- 空闲（下半，半价） -->
  <path d="M32 32 L32 52 A20 20 0 0 0 49.32 42 Z" fill="url(#ph-off)"/>
  <!-- 高峰（上半，标准价） -->
  <path d="M32 32 L32 12 A20 20 0 0 1 32 52 Z" fill="url(#ph-peak)"/>
  <circle cx="32" cy="32" r="4" fill="#0b1220"/>
  <!-- 指针指向右上（示意高峰） -->
  <path d="M32 32 L43 21" stroke="#f0f5ff" stroke-width="3" stroke-linecap="round"/>
</svg>
